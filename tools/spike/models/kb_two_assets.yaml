# Chapter 4's two-asset market, specialist version: two stocks whose values are correlated (rho_V = 0.6, as in
# the chapter), one competitive market maker pricing both, and two specialists. Trader 1 has a signal on stock 1
# only, trader 2 on stock 2 only; each trades both stocks. Illustrative costs and discounting, the same as the
# ch4_kyle_back example (eps 0.2, rho 0.5), not the chapter's eps = 2e-3, rho = 0.1.
#   V1 = sigma_V dwA,  V2 = sigma_V (c dwA + s dwB),  c = rho_V, s = sqrt(1 - rho_V^2)
#   dZ_k = (D1k + D2k) dt + sigma_Z dwZk,  P_k = E[V_k | both flows]
name: kb_two_assets
params: {eps: 0.2, rho: 0.5, gamma: 1.0, sigma_V: 1.0, sigma_Z: 1.0, c: 0.6, s: 0.8}
shocks: [wA, wB, wZ1, wZ2, w1, w2]
states:
  V1: sigma_V dwA
  V2: sigma_V c dwA + sigma_V s dwB
agents:
  market_maker:
    controls: [P1, P2]
    observes:
      flow1: D11 dt + D21 dt + sigma_Z dwZ1
      flow2: D12 dt + D22 dt + sigma_Z dwZ2
    loss: P1^2 - 2 P1 V1 + P2^2 - 2 P2 V2
    myopic: true
  trader1:
    controls: [D11, D12]
    observes:
      y1: (gamma V1 - gamma P1) dt + dw1
      flow1: D21 dt + sigma_Z dwZ1
      flow2: D22 dt + sigma_Z dwZ2
    loss: -D11 V1 + D11 P1 - D12 V2 + D12 P2 + eps D11^2 + eps D12^2
  trader2:
    controls: [D21, D22]
    observes:
      y2: (gamma V2 - gamma P2) dt + dw2
      flow1: D11 dt + sigma_Z dwZ1
      flow2: D12 dt + sigma_Z dwZ2
    loss: -D21 V1 + D21 P1 - D22 V2 + D22 P2 + eps D21^2 + eps D22^2
horizon:
  window: 8.0
  discount: rho
