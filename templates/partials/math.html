{#- KaTeX for pages written with $…$ math, served from the site (the same copy the dissertation uses) rather
    than a CDN. Only pages that set extra.math = true load it; see partials/head.html. -#}
<link rel="stylesheet" href="{{ get_url(path='dissertation/katex/katex.min.css', cachebust=true) }}" />
<script defer src="{{ get_url(path='dissertation/katex/katex.min.js', cachebust=true) }}"></script>
<script defer src="{{ get_url(path='dissertation/katex/auto-render.min.js', cachebust=true) }}"></script>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    if (!window.renderMathInElement) return;
    renderMathInElement(document.body, {
      delimiters: [
        { left: "$$", right: "$$", display: true },
        { left: "$", right: "$", display: false },
      ],
      throwOnError: false,
    });
  });
</script>
