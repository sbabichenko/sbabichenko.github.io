[[project]]
name = "Noise-State Calculus for Dynamic Games with Strategic Information"
desc = "My dissertation. Each player keeps estimates of the primitive shocks instead of belief hierarchies, so beliefs, prices and policies are impulse responses and equilibrium is a fixed point in them. The information wedge prices changing an opponent's beliefs."
tags = ["research", "dissertation"]
detour = true
image = "images/card-noisestate"
links = [
    { name = "pypi", url = "https://pypi.org/project/noisestate/" },
    { name = "github", url = "https://github.com/sbabichenko/noisestate" }
]

